<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Methods Instead of Prompts</title>

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <meta name="description" content="Interactive bilingual presentation about office work: stop writing a new prompt for every case, write a reusable method that builds the work order from today’s material and stops for review." />
    <meta property="og:title" content="Methods Instead of Prompts" />
    <meta property="og:description" content="The prompt you write today works once. A method works every time — it builds the work order from the material you attach, stops for your review, and only then does the work." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://voku.github.io/Prompt_Intro/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Methods Instead of Prompts" />
    <meta name="twitter:description" content="Office work: write the method once, let it build the work order for each case, and read half a page instead of four." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1e1e1e;
      }
      ::-webkit-scrollbar-thumb {
        background: #4b5563;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #6b7280;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fadeIn {
        animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes scaleIn {
        from { opacity: 0; transform: scale(0.9); }
        to { opacity: 1; transform: scale(1); }
      }
      .animate-scaleIn {
        animation: scaleIn 0.3s ease-out forwards;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
